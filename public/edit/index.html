<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: Arial, sans-serif; padding: 1rem; max-width: 500px; margin: auto; }
        input, button { font-size: 1rem; padding: .5rem; width: 100%; margin-top: .5rem; }
    </style>
</head>
<body>
<h2>Edit Task</h2>
<div id="loading">Loading…</div>
<div id="editor" style="display:none">
    <input id="title" placeholder="Task title" />
    <label>
        <input type="checkbox" id="completed" />
        Completed
    </label>
    <button id="save">Save</button>
    <div id="status" style="margin-top:1rem;color:green;"></div>
</div>

<!-- 1) Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
    // 2) Your Firebase web config—REPLACE these with your actual values:
    const firebaseConfig = {
      apiKey: "AIzaSyARNCy_7VuaCv4hhePfO5mE56L8QLcEA2w",                     // from firebase_options.dart
      authDomain: "to-do-49ef2.firebaseapp.com",       // your-project-id.firebaseapp.com
      projectId: "to-do-49ef2",                        // your-project-id
      storageBucket: "to-do-49ef2.firebasestorage.app",        // your-project-id.appspot.com
      messagingSenderId: "222842606351",               // numeric sender ID
      appId: "1:222842606351:web:45e9b69e0e5528987ae47a",        // web app ID
      measurementId: "G-0839T9ZL0C"                      // (if present)
    };
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 3) Grab taskId from URL: /edit/<taskId>
    const segments = window.location.pathname.split('/');
    const taskId = segments[segments.length - 1] || "";

    const docRef = db.collection('tasks').doc(taskId);
    const loadingEl = document.getElementById('loading');
    const editorEl  = document.getElementById('editor');
    const titleIn   = document.getElementById('title');
    const compIn    = document.getElementById('completed');
    const saveBtn   = document.getElementById('save');
    const statusEl  = document.getElementById('status');

    // 4) Real-time listener
    docRef.onSnapshot((doc) => {
      if (!doc.exists) {
        loadingEl.textContent = 'Task not found';
        return;
      }
      const data = doc.data();
      loadingEl.style.display = 'none';
      editorEl.style.display  = 'block';
      titleIn.value  = data.title || '';
      compIn.checked = data.completed || false;
    }, (error) => {
      loadingEl.textContent = 'Error loading task';
      console.error(error);
    });

    // 5) Save updates back to Firestore
    saveBtn.onclick = async () => {
      statusEl.textContent = 'Saving…';
      try {
        await docRef.update({
          title: titleIn.value,
          completed: compIn.checked,
        });
        statusEl.textContent = 'Saved ✔️';
        setTimeout(() => statusEl.textContent = '', 2000);
      } catch (e) {
        statusEl.textContent = 'Save failed';
        console.error(e);
      }
    };
</script>
</body>
</html>
